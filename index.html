<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Moje denní peníze</title>
  <style>
    :root{
      --bg1:#0b1020; --bg2:#111a33;
      --card: rgba(255,255,255,.08);
      --stroke: rgba(255,255,255,.12);
      --text:#eaf0ff; --muted: rgba(234,240,255,.72);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background: radial-gradient(900px 600px at 12% 0%, rgba(255,255,255,.08) 0%, transparent 55%),
                  radial-gradient(900px 600px at 88% 10%, rgba(0,0,0,.25) 0%, transparent 55%),
                  linear-gradient(180deg, #2f343c, #14161a);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 16px;
    }
    .wrap{width:min(980px, 100%)}
    header{
      display:flex; gap:12px; align-items:flex-end; justify-content:space-between;
      margin-bottom:18px;
    }
    h1{margin:0; font-size:28px; letter-spacing:.2px}
    .name{margin:6px 0 0; color:var(--muted)}
    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:12px;
    }
    .card{
      grid-column: span 6;
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      padding: 16px 16px 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
    }
    .label{color:var(--muted); font-size:13px; margin:0 0 8px}
    .value{font-size:26px; font-weight:700; margin:0}
    .sub{margin:8px 0 0; color:var(--muted); font-size:12px}
    .wide{grid-column: span 12}
    @media (max-width:720px){
      .card{grid-column: span 12}
      header{flex-direction:column; align-items:flex-start}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Moje denní peníze</h1>
        <p class="name">Jméno: <strong>Ivana Vojíková</strong></p>
      </div>
    </header>

    <section class="grid" aria-label="Dashboard metriky">
      <div class="card">
        <p class="label">Provize</p>
        <p class="value">5&nbsp;000&nbsp;Kč</p>
        <p class="sub">Dnes</p>
      </div>

      <div class="card">
        <p class="label">eKoruny</p>
        <p class="value">100</p>
        <p class="sub">Stav</p>
      </div>

      <div class="card">
        <p class="label">Produkce</p>
        <p class="value">20&nbsp;000&nbsp;Kč</p>
        <p class="sub">Dnes</p>
      </div>

      <div class="card">
        <p class="label">Smlouvy</p>
        <p class="value">4</p>
        <p class="sub">Dnes</p>
      </div>

      <div class="card">
        <p class="label">Body</p>
        <p class="value">6</p>
        <p class="sub">Dnes</p>
      </div>

      <div class="card wide">
        <p class="label">Shrnutí</p>
        <p class="value">Ivana Vojíková</p>
        <p class="sub">Rychlý přehled denních peněz na jedné stránce.</p>
      </div>
    </section>
  </div>
</body>
</html>
