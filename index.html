<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Moje denní peníze</title>
  <style>
    :root{
      --bg: #ffffff;
      --surface: #ffffff;
      --stroke: #e6e8ee;
      --text: #3c4043;
      --title: #1f2328;
      --muted: #6b7280;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background:
        radial-gradient(900px 600px at 12% 0%, rgba(0,0,0,.035) 0%, transparent 55%),
        radial-gradient(900px 600px at 88% 10%, rgba(0,0,0,.02) 0%, transparent 55%),
        var(--bg);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 16px;
    }
    .wrap{width:min(980px, 100%)}
    header{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-bottom:16px;
    }
    h1{margin:0; font-size:28px; letter-spacing:-.2px; color:var(--title)}
    .name{margin:0; color:var(--muted); font-size:14px}
    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:12px;
    }
    .card{
      grid-column: span 6;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: 16px;
      padding: 16px 16px 14px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, .06);
    }
    .label{color:var(--muted); font-size:12px; margin:0 0 8px; letter-spacing:.3px; text-transform:uppercase}
    .value{font-size:28px; font-weight:700; margin:0; color:var(--title)}
    .sub{margin:8px 0 0; color:var(--muted); font-size:12px}
    @media (max-width:720px){
      .card{grid-column: span 12}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Moje denní peníze</h1>
      <p class="name">Jméno: <strong>Ivana Vojíková</strong></p>
    </header>

    <section class="grid" aria-label="Dashboard metriky">
      <div class="card">
        <p class="label">Provize</p>
        <p class="value">5&nbsp;000&nbsp;Kč</p>
        <p class="sub">Dnes</p>
      </div>

      <div class="card">
        <p class="label">eKoruny</p>
        <p class="value">100</p>
        <p class="sub">Stav</p>
      </div>

      <div class="card">
        <p class="label">Produkce</p>
        <p class="value">20&nbsp;000&nbsp;Kč</p>
        <p class="sub">Dnes</p>
      </div>

      <div class="card">
        <p class="label">Smlouvy</p>
        <p class="value">4</p>
        <p class="sub">Dnes</p>
      </div>

      <div class="card">
        <p class="label">Body</p>
        <p class="value">6</p>
        <p class="sub">Dnes</p>
      </div>
    </section>
  </div>
</body>
</html>
