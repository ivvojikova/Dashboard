<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Moje denní peníze</title>
  <style>
    :root{
      --bg: #ffffff;
      --surface: #ffffff;
      --stroke: #e6e8ee;
      --text: #3c4043;
      --title: #1f2328;
      --muted: #6b7280;
      --shadow: 0 10px 24px rgba(15, 23, 42, .06);
      --shadowHover: 0 12px 28px rgba(15, 23, 42, .08);
      --radius: 18px;
      --accent: #e30613;
    }
    *{box-sizing:border-box}
    html, body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background:
        radial-gradient(900px 600px at 12% 0%, rgba(227, 6, 19, .08) 0%, transparent 55%),
        radial-gradient(900px 600px at 88% 10%, rgba(17, 24, 39, .05) 0%, transparent 55%),
        var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 16px;
    }
    .wrap{width:min(980px, 100%)}
    header{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-bottom:18px;
    }
    .headerTop{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    h1{
      margin:0;
      font-size:30px;
      letter-spacing:-.4px;
      color:var(--accent);
      line-height:1.1;
    }
    .name{
      margin:0;
      color:var(--muted);
      font-size:14px;
    }
    .name strong{
      color: var(--title);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.2px;
    }
    .position{
      margin:0;
      color:var(--muted);
      font-size:13px;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap:14px;
    }
    .card{
      grid-column: span 6;
      background: var(--surface);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 16px 16px 14px;
      box-shadow: var(--shadow);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      position: relative;
      overflow: hidden;
    }
    .card::before{
      content:"";
      position:absolute;
      top:0;
      left:0;
      height:100%;
      width:4px;
      background: linear-gradient(180deg, var(--accent), rgba(227, 6, 19, .55));
    }
    .card:hover{
      transform: translateY(-2px);
      box-shadow: var(--shadowHover);
      border-color: rgba(227, 6, 19, .22);
    }
    .card.featured{
      border-color: rgba(227, 6, 19, .35);
      background: linear-gradient(180deg, rgba(227, 6, 19, .06), rgba(227, 6, 19, 0));
    }
    .card.featured .value{
      color: var(--accent);
    }
    .top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin-bottom:10px;
    }
    .label{
      color:var(--muted);
      font-size:12px;
      margin:0;
      letter-spacing:.3px;
      text-transform:uppercase;
    }
    .value{
      font-size:30px;
      font-weight:760;
      margin:0;
      color:var(--title);
      letter-spacing:-.3px;
    }
    .sub{margin:8px 0 0; color:var(--muted); font-size:12px}
    @media (max-width:720px){
      body{
        padding:10px 12px 14px;
        align-items:flex-start;
      }
      header{gap:6px; margin-bottom:12px}
      .headerTop{gap:10px}
      .asOf{font-size:12px}
      h1{font-size:22px}
      .name{font-size:13px}
      .name strong{font-size:16px}
      .position{font-size:12px}

      .grid{gap:10px}
      .card{
        grid-column: span 6;
        padding: 12px 12px 11px;
      }
      .card::before{width:3px}
      .top{gap:8px; margin-bottom:8px}
      .label{font-size:11px}
      .value{font-size:22px}
      .card:hover{transform:none}
    }
    @media (max-width:380px){
      h1{font-size:20px}
      .value{font-size:20px}
      .grid{gap:8px}
    }
    @media (prefers-reduced-motion: reduce){
      .card, .card:hover{transition:none; transform:none}
    }

    .actions{
      margin-top:14px;
      display:flex;
      gap:10px;
      justify-content:center;
    }
    .metaRow{
      margin-top:10px;
      display:flex;
      justify-content:flex-start;
    }
    .asOf{
      margin:0;
      color:var(--muted);
      font-size:13px;
      white-space:nowrap;
    }
    .btn{
      appearance:none;
      border:1px solid var(--stroke);
      background:#fff;
      color:var(--title);
      border-radius:999px;
      padding:10px 14px;
      font-weight:700;
      letter-spacing:.2px;
      cursor:pointer;
      box-shadow: 0 6px 16px rgba(15,23,42,.05);
    }
    .btn.primary{
      border-color: rgba(227, 6, 19, .35);
      background: rgba(227, 6, 19, .08);
      color: var(--accent);
    }
    @media (max-width:720px){
      .actions{margin-top:12px}
      .metaRow{margin-top:8px}
      .asOf{font-size:12px}
      .btn{padding:9px 12px; font-size:13px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="headerTop">
        <h1>Moje denní peníze</h1>
      </div>
      <p class="name">Jméno: <strong>Ivana Vojíková</strong></p>
      <p class="position">Pozice: <strong>VIP Poradce Retail</strong></p>
    </header>

    <section class="grid" aria-label="Dashboard metriky">
      <div class="card featured">
        <div class="top">
          <p class="label">Provize</p>
        </div>
        <p class="value">5&nbsp;000&nbsp;Kč</p>
      </div>

      <div class="card">
        <div class="top">
          <p class="label">eKoruny</p>
        </div>
        <p class="value">100</p>
      </div>

      <div class="card">
        <div class="top">
          <p class="label">Produkce</p>
        </div>
        <p class="value">20&nbsp;000&nbsp;Kč</p>
      </div>

      <div class="card">
        <div class="top">
          <p class="label">Netto</p>
        </div>
        <p class="value">18&nbsp;000&nbsp;Kč</p>
      </div>

      <div class="card">
        <div class="top">
          <p class="label">Smlouvy</p>
        </div>
        <p class="value">4</p>
      </div>

      <div class="card">
        <div class="top">
          <p class="label">Body do VK</p>
        </div>
        <p class="value">6</p>
      </div>

      <div class="card">
        <div class="top">
          <p class="label">Získaná provize za období</p>
        </div>
        <p class="value">50&nbsp;000&nbsp;Kč</p>
      </div>
    </section>

    <div class="actions" aria-label="Ovládání">
      <button class="btn primary" type="button">DNES</button>
      <button class="btn" type="button">ZVOLIT DATUM</button>
    </div>
    <div class="metaRow">
      <p class="asOf">Data k 26.3.2026</p>
    </div>
  </div>
</body>
</html>
